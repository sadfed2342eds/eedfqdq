name: Update SLIP-44 catalog

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh SLIP-44 block in derivations.md
        run: python3 scripts/update_slip44.py

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/slip44-auto-update
          commit-message: "chore(slip44): refresh derivations.md from satoshilabs/slips"
          title: "chore(slip44): refresh derivations.md"
          body: |
            Automated refresh of the SLIP-0044 block in `derivations.md`.
            Source: https://github.com/satoshilabs/slips/blob/master/slip-0044.md
          delete-branch: true
